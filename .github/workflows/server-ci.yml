name: Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: subs_test
          TZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://app:app@localhost:5432/subs_test
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/subs_test
      JWT_ACCESS_SECRET: dev-ci-jwt-access-secret-minimum-32-chars
      JWT_REFRESH_SECRET: dev-ci-jwt-refresh-secret-minimum-32-chars
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
