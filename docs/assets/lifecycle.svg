<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Subscription state machine: DRAFT, QUOTATION, CONFIRMED, ACTIVE, PAUSED, CLOSED">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#17153d"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c7d2fe"/></marker>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="tglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#a5b4fc" fill-opacity="0.10"/></pattern>
    <style>
      .node { font: 700 15px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: .5px; }
      .lbl { font: 500 13px 'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace; fill: #cbd5e1; }
      .title { font: 700 20px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; fill: #e0e7ff; }
      .foot { font: 500 13px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .edge { fill: none; stroke-width: 2; opacity: .75; }
      .flow { fill: none; stroke-width: 1.4; stroke-dasharray: 3 14; opacity: .7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -34; } }
    </style>
  </defs>
  <rect width="1200" height="470" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="468" rx="19" fill="none" stroke="#818cf8" stroke-opacity="0.25"/>
  <text x="32" y="36" class="title">Subscription lifecycle</text>
  <text x="32" y="58" class="foot">stateMachine.ts · POST /subscriptions/:id/transition</text>
  <path d="M188.0,200 L246.0,200" class="edge" stroke="#818cf8" marker-end="url(#arrow)"/><path d="M188.0,200 L246.0,200" class="flow" stroke="#e0e7ff"/><text x="220" y="184" class="lbl" text-anchor="middle">send_quote</text><path d="M252.0,222 L194.0,222" class="edge" stroke="#64748b" marker-end="url(#arrow)"/><path d="M252.0,222 L194.0,222" class="flow" stroke="#e0e7ff"/><text x="220" y="244" class="lbl" text-anchor="middle">revise</text><path d="M408.0,210 L466.0,210" class="edge" stroke="#818cf8" marker-end="url(#arrow)"/><path d="M408.0,210 L466.0,210" class="flow" stroke="#e0e7ff"/><text x="440" y="198" class="lbl" text-anchor="middle">confirm</text><path d="M628.0,210 L706.0,210" class="edge" stroke="#818cf8" marker-end="url(#arrow)"/><path d="M628.0,210 L706.0,210" class="flow" stroke="#e0e7ff"/><text x="670" y="198" class="lbl" text-anchor="middle">activate</text><path d="M775,237.0 L775,337.0" class="edge" stroke="#fbbf24" marker-end="url(#arrow)"/><path d="M775,237.0 L775,337.0" class="flow" stroke="#e0e7ff"/><text x="762" y="295.0" class="lbl" text-anchor="end">pause</text><path d="M805,343.0 L805,243.0" class="edge" stroke="#34d399" marker-end="url(#arrow)"/><path d="M805,343.0 L805,243.0" class="flow" stroke="#e0e7ff"/><text x="818" y="295.0" class="lbl" text-anchor="start">resume</text><path d="M868.0,210 L991.0,210" class="edge" stroke="#f87171" marker-end="url(#arrow)"/><path d="M868.0,210 L991.0,210" class="flow" stroke="#e0e7ff"/><text x="932" y="198" class="lbl" text-anchor="middle">close</text><path d="M868.0,370 C990,370 1075,340 1075,243.0" class="edge" stroke="#f87171" marker-end="url(#arrow)"/><path d="M868.0,370 C990,370 1075,340 1075,243.0" class="flow" stroke="#e0e7ff"/><text x="985" y="394" class="lbl" text-anchor="middle">close</text><path d="M772,183.0 C752,135.0 828,135.0 808,177.0" class="edge" stroke="#34d399" marker-end="url(#arrow)"/><path d="M772,183.0 C752,135.0 828,135.0 808,177.0" class="flow" stroke="#e0e7ff"/><text x="836" y="153.0" class="lbl" text-anchor="start">renew</text><path d="M110,183.0 C110,40 1095,40 1095,177.0" class="edge" stroke="#64748b" marker-end="url(#arrow)"/><path d="M110,183.0 C110,40 1095,40 1095,177.0" class="flow" stroke="#e0e7ff"/><text x="600" y="66" class="lbl" text-anchor="middle">cancel</text><path d="M330,183.0 C330,95 1055,95 1055,177.0" class="edge" stroke="#64748b" marker-end="url(#arrow)"/><path d="M330,183.0 C330,95 1055,95 1055,177.0" class="flow" stroke="#e0e7ff"/><text x="600" y="108" class="lbl" text-anchor="middle">cancel</text>
  <g><rect x="26.0" y="177.0" width="168" height="66" rx="18" fill="#94a3b8" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0500;0.0850;1.0000" values="1.0000;1.0000;0.0000;0.0000"/></rect><rect x="32.0" y="183.0" width="156" height="54" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/><circle cx="52.0" cy="210" r="5" fill="#94a3b8"/><text x="118" y="216" class="node" text-anchor="middle" fill="#94a3b8">DRAFT</text></g><g><rect x="246.0" y="177.0" width="168" height="66" rx="18" fill="#38bdf8" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.1333;0.1584;0.2083;0.2433;1.0000" values="0.0000;0.0000;1.0000;1.0000;0.0000;0.0000"/></rect><rect x="252.0" y="183.0" width="156" height="54" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><circle cx="272.0" cy="210" r="5" fill="#38bdf8"/><text x="338" y="216" class="node" text-anchor="middle" fill="#38bdf8">QUOTATION</text></g><g><rect x="466.0" y="177.0" width="168" height="66" rx="18" fill="#a78bfa" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.2917;0.3168;0.3667;0.4017;1.0000" values="0.0000;0.0000;1.0000;1.0000;0.0000;0.0000"/></rect><rect x="472.0" y="183.0" width="156" height="54" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><circle cx="492.0" cy="210" r="5" fill="#a78bfa"/><text x="558" y="216" class="node" text-anchor="middle" fill="#a78bfa">CONFIRMED</text></g><g><rect x="706.0" y="177.0" width="168" height="66" rx="18" fill="#34d399" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.4500;0.4751;0.5250;0.5600;0.7667;0.7918;0.8417;0.8767;1.0000" values="0.0000;0.0000;1.0000;1.0000;0.0000;0.0000;1.0000;1.0000;0.0000;0.0000"/></rect><rect x="712.0" y="183.0" width="156" height="54" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/><circle cx="732.0" cy="210" r="5" fill="#34d399"/><text x="798" y="216" class="node" text-anchor="middle" fill="#34d399">ACTIVE</text></g><g><rect x="706.0" y="337.0" width="168" height="66" rx="18" fill="#fbbf24" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.6083;0.6334;0.6833;0.7183;1.0000" values="0.0000;0.0000;1.0000;1.0000;0.0000;0.0000"/></rect><rect x="712.0" y="343.0" width="156" height="54" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><circle cx="732.0" cy="370" r="5" fill="#fbbf24"/><text x="798" y="376" class="node" text-anchor="middle" fill="#fbbf24">PAUSED</text></g><g><rect x="991.0" y="177.0" width="168" height="66" rx="18" fill="#f87171" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.9250;0.9501;1.0000;1.0000" values="0.0000;0.0000;1.0000;1.0000;0.0000"/></rect><rect x="997.0" y="183.0" width="156" height="54" rx="14" fill="#0f172a" stroke="#f87171" stroke-width="2"/><circle cx="1017.0" cy="210" r="5" fill="#f87171"/><text x="1083" y="216" class="node" text-anchor="middle" fill="#f87171">CLOSED</text></g>
  <circle r="7" fill="#f0abfc" filter="url(#tglow)">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0500;0.1583;0.2083;0.3167;0.3667;0.4750;0.5250;0.6333;0.6833;0.7917;0.8417;0.9500;1.0000" keyPoints="0.0000;0.0000;0.1712;0.1712;0.3424;0.3424;0.5292;0.5292;0.6537;0.6537;0.7782;0.7782;1.0000;1.0000" path="M52,210 L272,210 L492,210 L732,210 L732,370 L732,210 L1017,210"/>
  </circle>
  <text x="32" y="446" class="foot">Every arrow is one action. Anything else returns <tspan fill="#f87171" font-family="Consolas, Menlo, monospace">400 INVALID_TRANSITION</tspan> with the allowed actions. Plan flags (pausable · closable · renewable) and role narrow it further.</text>
</svg>
